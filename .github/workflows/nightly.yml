# SPDX-License-Identifier: GPL-3.0-or-later
# A nightly, only when started by hand: if main has changed (more than docs) since
# the last one and CI passed on it, builds everything as a release does
# (build.yml) at version <next>-nightly.N, publishes it as a pre-release
# named for a flower (nightly-name.py), and points the nightly channel's feed
# at it (write-feed.py, publish-feed.sh), where installs on Nightly find it.
# The last few nightlies are kept; older ones are removed.
name: Nightly

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last nightly"
        type: boolean
        default: false

permissions:
  contents: write
  # Which CI runs passed, and what they built.
  actions: read

# One nightly at a time, in order; a running one is never cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Is a nightly due?
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.plan.outputs.due }}
      version: ${{ steps.plan.outputs.version }}
      number: ${{ steps.plan.outputs.number }}
      name: ${{ steps.plan.outputs.name }}
      commit: ${{ steps.plan.outputs.commit }}
      previous: ${{ steps.plan.outputs.previous }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          no() { echo "::notice::no nightly: $1"; echo "due=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The last nightly (newest first), and what it was built from.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]+$")))][0].tagName // ""')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ] && [ "$FORCE" != "true" ]; then
            git fetch -q origin "refs/tags/$previous:refs/tags/$previous"
            built=$(git rev-list -n 1 "$previous")
            [ "$built" = "$commit" ] && no "main hasn't changed since $previous"
            # Docs alone don't make a new build.
            if git diff --name-only --no-renames "$built" "$commit" | bash .github/scripts/docs-only.sh; then
              no "only docs changed since $previous"
            fi
          fi

          # CI must have built and tested this commit, or one with only docs
          # after it: CI skips its builds for a docs-only push, so a passing
          # run on the newest commit alone doesn't mean its code was tested.
          # The newest passing push run whose Windows app job ran is the last
          # tested commit (a failure, or a run still going, waits for the
          # next slot).
          tested=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=50" \
            --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); do
            built_here=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Windows app (x64)" and .conclusion == "success")] | length')
            if [ "$built_here" -gt 0 ]; then tested="${run#*:}"; break; fi
          done
          [ -n "$tested" ] || no "no CI run on main has built and tested the code yet"
          if [ "$tested" != "$commit" ]; then
            git merge-base --is-ancestor "$tested" "$commit" ||
              no "the last tested commit, ${tested:0:7}, isn't on main any more"
            git diff --name-only --no-renames "$tested" "$commit" | bash .github/scripts/docs-only.sh ||
              no "CI hasn't built and tested the code at ${commit:0:7} yet"
          fi

          # The version on the way: what Cargo.toml says, or the next patch
          # when that's already released.
          current=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$current" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            IFS=. read -r major minor patch <<< "$current"
            base="$major.$minor.$((patch + 1))"
          else
            base="$current"
          fi
          # The next number on the way to it (Android takes up to 998).
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$base-nightly.\")) | ltrimstr(\"v$base-nightly.\") | tonumber] | max // 0")
          number=$((last + 1))
          [ "$number" -le 998 ] || { echo "::error::998 nightlies on the way to $base; release it first"; exit 1; }
          version="$base-nightly.$number"
          name=$(python3 .github/scripts/nightly-name.py "$number")
          {
            echo "due=true"
            echo "version=$version"
            echo "number=$number"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          # What changed, for the notes. Each line starts with "- ", so none can end this.
          if [ -n "$previous" ]; then
            git fetch -q origin "refs/tags/$previous:refs/tags/$previous"
            {
              echo "changes<<END_OF_CHANGES"
              python3 .github/scripts/nightly-changes.py "$previous" "$commit"
              echo "END_OF_CHANGES"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::building $version ($name) from ${commit:0:7}"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.due == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    name: Publish the nightly
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      NUMBER: ${{ needs.plan.outputs.number }}
      NAME: ${{ needs.plan.outputs.name }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      CHANGES: ${{ needs.plan.outputs.changes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: .github/scripts
      - name: Publish it as a pre-release
        run: |
          set -euo pipefail
          cd files
          sha256sum *.exe *.deb *.rpm *.AppImage *.tar.gz *.apk install.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
          compare=""
          if [ -n "$PREVIOUS" ]; then
            compare="All the commits since the last nightly: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...v$VERSION"
          fi
          changes=""
          if [ -n "$CHANGES" ]; then
            changes=$(printf '## Changes since the last nightly\n\n%s\n\n' "$CHANGES")
          fi
          printf '%s\n' \
            "Nightly $NUMBER, **$NAME**: built from main at ${COMMIT:0:7} on $(date -u +%Y-%m-%d)." \
            "" \
            "A build for trying what's new before it's released, with the latest fixes and features and sometimes new bugs. NectarLink installs on the Nightly channel update to it by themselves; to get it, pick **Nightly** under Settings, Updates, in the PC app or on the phone." \
            "" \
            "$changes" \
            "" \
            "$compare" > notes.md
          gh release create "v$VERSION" *.exe *.deb *.rpm *.AppImage *.tar.gz *.apk install.sh SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease \
            --title "Nightly $NUMBER · $NAME ($VERSION)" --notes-file notes.md
      - name: Point the nightly feed at it
        run: |
          set -euo pipefail
          python3 source/.github/scripts/write-feed.py nightly "v$VERSION" "$NAME" nightly.json
          bash source/.github/scripts/publish-feed.sh nightly nightly.json
      - name: Keep the last six nightlies
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' |
          while read -r tag; do
            [ "$tag" = "v$VERSION" ] && continue
            echo "removing $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
