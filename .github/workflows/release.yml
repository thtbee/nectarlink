# SPDX-License-Identifier: GPL-3.0-or-later
# A tag like v0.1.0 builds the Windows installers, the Linux packages and the
# signed Android app (build.yml), and puts them on a draft GitHub release
# with their SHA-256 sums, which the apps' updaters check, for a maintainer
# to review and publish. Publishing it updates the stable channel's feed
# (channels.yml).
name: Release

on:
  push:
    # Releases only: nightly tags (v1.2.3-nightly.N) are made by nightly.yml.
    tags: ["v*", "!v*-nightly.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  version:
    name: The tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: |
            Cargo.toml
            CHANGELOG.md
            .github/scripts
      - name: Draft it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release's name, if Cargo.toml gives one ([workspace.metadata.release]).
          name=$(awk '/^\[workspace.metadata.release\]/{f=1;next} /^\[/{f=0} f && /^name = /{print $3}' source/Cargo.toml | tr -d '"')
          title="NectarLink ${GITHUB_REF_NAME#v}${name:+ $name}"
          cd files
          sha256sum *.exe *.deb *.rpm *.AppImage *.tar.gz *.apk install.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # The notes: this version's section of CHANGELOG.md ("## <version> ..."),
          # with its wrapped lines joined, or GitHub's generated notes when
          # there isn't one.
          awk -v v="${GITHUB_REF_NAME#v}" '$1=="##" && $2==v {f=1; next} f && /^## / {exit} f' \
            ../source/CHANGELOG.md | awk -f ../source/.github/scripts/unwrap-notes.awk > notes.md || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "${{ github.ref_name }}" *.exe *.deb *.rpm *.AppImage *.tar.gz *.apk install.sh SHA256SUMS.txt \
            --repo "${{ github.repository }}" --draft "${notes[@]}" --title "$title"
