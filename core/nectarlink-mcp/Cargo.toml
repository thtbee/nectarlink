[package]
name = "nectarlink-mcp"
description = "NectarLink for AI agents over MCP: a stdio server that forwards to the running app's agent gateway"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nectarlink-agent"
path = "src/bin/nectarlink-agent.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
dirs.workspace = true
# Held to a release at least a week old; it moves quickly. Only this crate uses it.
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-std", "rt-multi-thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
