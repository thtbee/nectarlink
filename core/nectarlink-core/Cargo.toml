[package]
name = "nectarlink-core"
description = "Nectarlink engine: identity, pairing, sessions and storage"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nectarlink-protocol.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
n0-future.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
data-encoding.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15"
sha2.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
