[package]
name = "nectarlink-pam-unlock"
description = "Linux-PAM verifier and enrollment tool for NectarLink phone unlock"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pam_nectarlink_phone_unlock"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nectarlink-protocol.workspace = true
ring = "0.17"
rustix = { version = "1", features = ["fs", "net", "process"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
