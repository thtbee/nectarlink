[workspace]
resolver = "3"
members = [
    "core/nectarlink-protocol",
    "core/nectarlink-core",
    "core/nectarlink-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
authors = ["The Nectarlink contributors"]
repository = "https://github.com/thtbee/nectarlink"

[workspace.dependencies]
nectarlink-protocol = { path = "core/nectarlink-protocol" }
nectarlink-core = { path = "core/nectarlink-core" }

anyhow = "1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
hmac = "0.13"
iroh = "1.3"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
