[workspace]
resolver = "3"
members = [
    "core/nectarlink-adb",
    "core/nectarlink-protocol",
    "core/nectarlink-core",
    "core/nectarlink-cli",
    "core/nectarlink-ffi",
    "desktop/app",
    "desktop/vcam",
    "tools/xtask",
    "spikes/s1-qt-rust",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.97"
authors = ["The NectarLink contributors"]
repository = "https://github.com/thtbee/nectarlink"

# Each release's name, from a bee's life (0.1 Pollen, …); the release
# workflow puts it in the release's title.
[workspace.metadata.release]
name = "Pollen"

[workspace.dependencies]
nectarlink-adb = { path = "core/nectarlink-adb", version = "0.1.4" }
nectarlink-protocol = { path = "core/nectarlink-protocol", version = "0.1.4" }
nectarlink-core = { path = "core/nectarlink-core", version = "0.1.4" }
nectarlink-vcam = { path = "desktop/vcam", version = "0.1.4" }

anyhow = "1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
# Held to the version cxx-qt 0.10 generates its C++ for: a newer cxx changes
# the bridge's symbol names and the Windows app no longer links. Move it
# together with cxx-qt.
cxx = "=1.0.202"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
embed-resource = "3"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
data-encoding = "2.11"
dirs = "7"
hostname = "0.4"
hmac = "0.13"
iroh = "1.3"
# 1.4.0 closes a connection when a stream buffers more than 1024 chunks, and
# its compaction never merges chunks it has already compacted, so a receiver
# that stops reading for a moment (a paused transfer, slow storage) loses the
# link. Held on 1.3 until a release fixes it.
noq-proto = { version = "~1.3", default-features = false }
iroh-mdns-address-lookup = "0.6"
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }
n0-future = "0.3"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
blake3 = "1"
bytes = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uniffi = "0.32"
tokio-util = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
windows = "0.62"
# The same version windows itself depends on, never newer on its own.
windows-core = "0.62"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds: full debug info for our crates, line tables only for
# dependencies (backtraces still name their lines). Keeps target/debug from
# growing by gigabytes per rebuild.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Android: release optimizations, but symbols are kept so UniFFI can read its
# metadata from the library; the Android build strips them when packaging.
[profile.android]
inherits = "release"
strip = "debuginfo"
